{% extends "base.html" %}

{% block title %}Log-in{% endblock %}

{% block content %}
  <h1>Log-in</h1>
  <p>Please, use the following form to log-in:</p>
  <form method="post">
    {{ form.as_p }}
    {% csrf_token %}
    <p><input type="submit" value="Log in"></p>
    
    <!-- Links limpos exatamente como o livro ensina até a página 200 -->
    <p><a href="{% url 'account:password_reset' %}">Forgotten your password?</a></p>
    <p><a href="{% url 'account:register' %}">Create an account</a></p>
  </form>
{% endblock %}
